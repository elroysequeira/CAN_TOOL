<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>CANBench</title>
<link rel="icon" type="image/png" href="/static/connectm_mark.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <nav id="rail"></nav>
  <main id="main"></main>
  <footer id="status"></footer>
</div>
<div id="dock"></div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script src="/static/app.js"></script>
<script>
  // If the UI bundle did not load completely, say so instead of showing a page that silently does nothing.
  window.addEventListener("load", function () {
    if (typeof CB === "undefined" || !CB.views || !CB.views.firmware || !CB.views.setup) {
      document.body.innerHTML = '<div style="font:15px system-ui;max-width:560px;margin:15vh auto;padding:24px;line-height:1.6">' +
        '<h2>CANBench could not load its interface</h2>Press <b>Ctrl+F5</b> to reload. If this keeps happening, ' +
        'close this window and start run_canbench.bat again.</div>';
    }
  });
</script>
</body>
</html>
